<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación a la Fiesta de Bebé</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            text-align: center;
            padding: 20px;
            animation: sparkle 1.5s infinite;
        }
        @keyframes sparkle {
            0% { background-color: #f0f8ff; }
            50% { background-color: #e6f7ff; }
            100% { background-color: #f0f8ff; }
        }
        h1 {
            color: #ff69b4;
            font-size: 2.5em;
            margin-bottom: 0.5em;
            transition: opacity 1.5s ease-in-out;
        }
        #music {
            display: none;
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }
        #playButton {
            padding: 10px 20px;
            background-color: #ff69b4;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <h1>¡Estás Invitado a la Fiesta de Bebé!</h1>
    <p>Ven y celebra con nosotros el nuevo miembro de la familia.</p>
    <img src="dinos.png" alt="Dinosaurios" style="max-width: 80%; height: auto;">
    <h2>Itinerario:</h2>
    <p><img src="itinerario.png" alt="Itinerario" style="max-width: 80%; height: auto;"></p>
    <p>Por favor, no olvides traer tu mejor sonrisa.</p>
    <button id="playButton">Escuchar Canción</button>
    <audio id="music" controls>
        <source src="cancion.mp3" type="audio/mpeg">
        Tu navegador no soporta el audio.
    </audio>
    <script>
        const playButton = document.getElementById('playButton');
        const music = document.getElementById('music');

        playButton.addEventListener('click', () => {
            music.style.display = 'block';
            setTimeout(() => {
                music.style.opacity = '1';
                music.play();
            }, 1000);
        });
    </script>
</body>
</html>
